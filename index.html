    background-position: center top;
    z-index: 0;
  }

  .bg-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      rgba(255,200,215,0.5) 0%,
      rgba(255,230,240,0.35) 50%,
      rgba(200,230,255,0.4) 100%
    );
    z-index: 1;
  }

  .hearts-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }

  .heart-particle {
    position: absolute;
    bottom: -60px;
    animation: floatUp linear infinite;
    opacity: 0;
    user-select: none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-10deg) scale(0.4); opacity: 0; }
    8%   { opacity: 0.9; }
    92%  { opacity: 0.6; }
    100% { transform: translateY(-115vh) rotate(20deg) scale(1.1); opacity: 0; }
  }

  /* Pages */
  .page {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    min-height: 100dvh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
  }
  .page.active { display: flex; }

  /* Card */
  .card {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 32px;
    padding: 40px 28px 36px;
    text-align: center;
    width: 100%;
    max-width: 400px;
    box-shadow:
      0 24px 64px rgba(180,60,100,0.18),
      0 1px 0 rgba(255,255,255,0.9) inset;
    border: 1.5px solid rgba(255,255,255,0.85);
    animation: popIn 0.7s cubic-bezier(.22,1,.36,1);
  }

  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.88) translateY(30px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Emoji icon */
  .icon-wrap {
    width: 88px;
    height: 88px;
    background: linear-gradient(135deg, #ffd6e7, #ffb3ca);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 44px;
    box-shadow: 0 8px 24px rgba(220,80,120,0.25);
    animation: heartbeat 2s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    20% { transform: scale(1.12); }
    40% { transform: scale(1); }
    60% { transform: scale(1.07); }
  }

  .question-text {
    font-family: 'Dancing Script', cursive;
    font-size: 2rem;
    font-weight: 700;
    color: #a01840;
    text-shadow: 0 1px 8px rgba(255,255,255,0.95);
    margin-bottom: 6px;
    line-height: 1.25;
  }

  .sub-text {
    color: #c06080;
    font-size: 0.88rem;
    font-weight: 400;
    margin-bottom: 32px;
    letter-spacing: 0.2px;
  }

  /* YES / NO buttons — SIDE BY SIDE, clear & distinct */
  .btn-row {
    display: flex;
    gap: 0;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 130px;
    width: 100%;
  }

  .btn-yes {
    width: 47%;
    background: linear-gradient(145deg, #ff5b8a, #c0365a);
    color: white;
    border: none;
    padding: 17px 8px;
    border-radius: 20px;
    font-size: 1.05rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    box-shadow:
      0 6px 20px rgba(200,40,80,0.45),
      0 2px 0 rgba(255,255,255,0.18) inset;
    transition: transform 0.18s, box-shadow 0.18s;
    letter-spacing: 0.3px;
    position: absolute;
    left: 3%;
    z-index: 2;
  }
  .btn-yes:active { transform: scale(0.95); }

  .btn-no {
    width: 47%;
    background: rgba(255,255,255,0.9);
    color: #c0365a;
    border: 2.5px solid #f07090;
    padding: 14.5px 8px;
    border-radius: 20px;
    font-size: 1rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(200,80,110,0.12);
    transition: transform 0.18s;
    white-space: nowrap;
    position: absolute;
    right: 3%;
    z-index: 1;
  }

  /* Page 2 */
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff5b8a, #c0365a);
    color: white;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    box-shadow: 0 3px 10px rgba(200,40,80,0.3);
  }

  .letter-box {
    background: rgba(255,230,238,0.6);
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 18px;
    border-left: 4px solid #e83a6a;
    text-align: left;
  }

  .letter-box p {
    font-size: 0.9rem;
    color: #8b2040;
    line-height: 1.65;
    font-style: italic;
  }

  .page2-question {
    font-family: 'Dancing Script', cursive;
    font-size: 1.75rem;
    font-weight: 700;
    color: #a01840;
    text-shadow: 0 1px 8px rgba(255,255,255,0.9);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .page2-sub {
    color: #c06080;
    font-size: 0.85rem;
    margin-bottom: 18px;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    border: 2px solid rgba(240,140,170,0.5);
    border-radius: 18px;
    padding: 14px 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    color: #8b2040;
    background: rgba(255,255,255,0.7);
    resize: none;
    outline: none;
    transition: border 0.3s, background 0.3s;
    margin-bottom: 16px;
    -webkit-appearance: none;
  }
  textarea:focus {
    border-color: #e83a6a;
    background: rgba(255,255,255,0.88);
  }
  textarea::placeholder { color: #dda0b8; }

  .btn-send {
    width: 100%;
    background: linear-gradient(145deg, #ff5b8a, #c0365a);
    color: white;
    border: none;
    padding: 18px;
    border-radius: 22px;
    font-size: 1.05rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(200,40,80,0.4);
    transition: transform 0.18s;
    letter-spacing: 0.5px;
  }
  .btn-send:active { transform: scale(0.97); }
  .btn-send:disabled { opacity: 0.55; }

  .sending-text {
    display: none;
    color: #c0365a;
    font-size: 0.85rem;
    margin-top: 12px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Page 3 */
  .thankyou-icon {
    width: 100px; height: 100px;
    background: linear-gradient(135deg, #ffd6e7, #ffb3ca);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 52px;
    box-shadow: 0 10px 30px rgba(220,80,120,0.3);
    animation: pop 0.7s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes pop {
    0%   { transform: scale(0) rotate(-20deg); }
    80%  { transform: scale(1.15) rotate(5deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .thankyou-title {
    font-family: 'Dancing Script', cursive;
    font-size: 2.2rem;
    font-weight: 700;
    color: #a01840;
    text-shadow: 0 1px 8px rgba(255,255,255,0.95);
    margin-bottom: 10px;
  }
  .thankyou-sub {
    color: #c06080;
    font-size: 0.92rem;
    line-height: 1.75;
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    border-radius: 3px;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 999;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-10px) rotate(0) scaleX(1); opacity: 1; }
    100% { transform: translateY(105vh) rotate(540deg) scaleX(0.5); opacity: 0; }
  }

  .ripple {
    position: fixed;
    border-radius: 50%;
    background: rgba(255,80,120,0.22);
    animation: rippleOut 0.65s ease-out forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes rippleOut {
    0%   { transform: scale(0); opacity: 1; }
    100% { transform: scale(10); opacity: 0; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>
<div class="hearts-bg" id="heartsBg"></div>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <div class="card">
    <div class="icon-wrap">💕</div>
    <div class="question-text">Sen meni sevasanmi?</div>
    <div class="sub-text">Yurakdan javob ber 🌸</div>
    <div class="btn-row" id="btnContainer">
      <button class="btn-yes" onclick="yesClicked(event)">💖 Ha</button>
      <button class="btn-no" id="noBtn" onmouseover="runAway()" ontouchstart="runAway()">🙈 Yo'q</button>
    </div>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <div class="card">
    <div class="icon-wrap">🌹</div>
    <div class="badge">18 sm</div>
    <div class="letter-box">
      <p>ha goooner</p>
    </div>
    <div class="page2-question">sikishamizmi</div>
    <div class="page2-sub">Xayolingizdagi narsalarni yozing 💌</div>
    <textarea id="futureText" placeholder="bez prezvativ bilan"></textarea>
    <button class="btn-send" onclick="sendMessage()">💌 Yuborish</button>
    <div class="sending-text" id="sendingText">⏳ Yuborilmoqda...</div>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <div class="card">
    <div class="thankyou-icon">🥰</div>
    <div class="thankyou-title">Rahmat, azizim!</div>
    <div class="thankyou-sub">Xatingiz yetib bordi 💌<br>Ko'p o'tmay javob olasiz...</div>
  </div>
</div>

<script>
  const BOT_TOKEN = '9160946997:AAEsS81SM9l5xQ3NH84bnSAJyyp5k3gwOGY';
  const CHAT_ID = '9160946997';
  const heartsBg = document.getElementById('heartsBg');
  const emojis = ['❤️','💕','💗','💓','💖','🌸','💝','🌹','✨','💫'];

  function createHeart() {
    const h = document.createElement('div');
    h.className = 'heart-particle';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    const dur = 7 + Math.random() * 7;
    h.style.animationDuration = dur + 's';
    h.style.animationDelay = (Math.random() * 2) + 's';
    heartsBg.appendChild(h);
    setTimeout(() => h.remove(), (dur + 3) * 1000);
  }
  setInterval(createHeart, 500);
  for (let i = 0; i < 12; i++) setTimeout(createHeart, i * 300);

  function runAway() {
    const btn = document.getElementById('noBtn');
    const container = document.getElementById('btnContainer');
    const cw = container.offsetWidth;
    const bw = btn.offsetWidth;
    const x = (Math.random() - 0.5) * (cw - bw + 40);
    const y = (Math.random() - 0.5) * 160;
    btn.style.transform = `translate(${x}px, ${y}px)`;
    btn.style.transition = 'transform 0.2s cubic-bezier(.36,.07,.19,.97)';
  }

  function yesClicked(e) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.cssText = `width:80px;height:80px;left:${e.clientX-40}px;top:${e.clientY-40}px`;
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
    setTimeout(() => {
      document.getElementById('page1').classList.remove('active');
      document.getElementById('page2').classList.add('active');
    }, 420);
  }

  async function sendMessage() {
    const text = document.getElementById('futureText').value.trim();
    if (!text) {
      document.getElementById('futureText').style.borderColor = '#e83a6a';
      document.getElementById('futureText').placeholder = 'Iltimos, nimadir yozing 🥺';
      return;
    }
    const btn = document.querySelector('.btn-send');
    const sending = document.getElementById('sendingText');
    btn.disabled = true;
    sending.style.display = 'block';
    const msg = `💌 *Mehrojga xat keldi!*\n\n💕 *Sevaman dedi:* Ha\n\n🌹 *Kelajak haqida:*\n${text}`;
    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown'})
      });
    } catch(e) {}
    document.getElementById('page2').classList.remove('active');
    document.getElementById('page3').classList.add('active');
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ['#ff5b8a','#ffb3ca','#ffd6e7','#c0365a','#87CEEB','#ffffff','#ffe4ec'];
    for (let i = 0; i < 90; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        const size = 7 + Math.random() * 9;
        c.style.cssText = `left:${Math.random()*100}vw;top:-12px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${size}px;height:${size*0.5}px;border-radius:2px;animation-duration:${2.2+Math.random()*2}s`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }, i * 38);
    }
  }
</script>
</body>
</html>
